name: Java CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-jwt-secret-for-github-actions-testing
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ecampus_test
      SPRING_DATASOURCE_USERNAME: ecampus
      SPRING_DATASOURCE_PASSWORD: ecampus_test_password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ecampus_test
          POSTGRES_USER: ecampus
          POSTGRES_PASSWORD: ecampus_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecampus -d ecampus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build and run tests
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify